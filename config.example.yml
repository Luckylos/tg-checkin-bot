# Telegram 定时签到配置
# 推荐使用 -100... 这种数字 chat_id 作为群组唯一标识，避免 username 改名导致失效。
# 修改后容器会在 CONFIG_RELOAD_SECONDS 周期内自动重载；也可通过控制命令即时修改。
timezone: Asia/Shanghai

default_delay_seconds: 3
# 单个任务 cron 留空时使用该默认值；不配置则内置为每天 00:10:00。
default_cron: "0 10 0 * * *"
# 防封禁：cron 留空/默认的任务会在触发后按任务稳定错峰 0~1800 秒发送，避免大量群同秒发送。
default_stagger_seconds: 1800
default_stagger_mode: stable

groups:
  - name: HyVPS 示例
    enabled: true
    chat_id: -1003849837200
    # 关键点：BotFather 命令在 Telegram 中不是纯文本，需要以 bot_command entity 发送。
    message: /checkin@HyVPS_Bot
    parse_bot_command: true
    # 旧格式仍支持：单个群组直接配置一个 cron。
    cron: "0 5 9 * * *"
    run_on_start: false

  - name: 同群多时间段示例
    enabled: false
    chat_id: -1001234567890
    parse_bot_command: true
    # 新格式：同一群组下多个任务，每个任务可以在不同时间发送不同内容。
    tasks:
      - name: morning
        cron: "0 10 9 * * *"
        message: /checkin@SomeBot
      - name: night
        cron: "0 10 21 * * *"
        message: /sign@OtherBot
      - name: text-message
        cron: "0 0 23 * * *"
        message: "签到"
        parse_bot_command: false
    # 可选：任务级未覆盖时继承该错峰窗口；0 表示关闭。
    stagger_seconds: 1800

  - name: 按钮状态机示例
    enabled: false
    chat_id: example_bot
    parse_bot_command: true
    tasks:
      - name: 每日签到
        cron: ""
        message: "📅 每日签到"
        run_on_start: false
      - name: plus兑换
        cron: "0 0 0 * * *"
        run_on_start: false
        flow:
          - send: "/start"
            expect: "积分商城"
            timeout_seconds: 20
          - send: "🛍️ 积分商城"
            expect: "Plus 成品号"
            timeout_seconds: 20
          - send: "💎 Plus 成品号(PP渠道) · 3积分"
            expect: "确认兑换"
            timeout_seconds: 20
          - send: "✅ 确认兑换"
            expect_any:
              - "兑换"
              - "上限"
              - "积分不足"
            timeout_seconds: 25
