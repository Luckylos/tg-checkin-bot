version: "3.8"

services:
  tg-checkin:
    build: .
    container_name: tg-checkin
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yml:/config/config.yml:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
